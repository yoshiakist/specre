[package]
name = "specre"
version = "0.0.1"
edition = "2024"
description = "Atomic, living specification cards for AI-agent-friendly development"
license = "MIT"
repository = "https://github.com/yoshiakist/specre"

[dependencies]
clap = { version = "4", features = ["derive"] }
ulid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
