[package]
name = "specre"
version = "0.2.6"
edition = "2024"
description = "Atomic, living specification cards for AI-agent-friendly development"
license = "MIT"
repository = "https://github.com/yoshiakist/specre"

[dependencies]
clap = { version = "4", features = ["derive"] }
ulid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }
rmcp = { version = "0.15", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_yaml = "0.9.34"

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
