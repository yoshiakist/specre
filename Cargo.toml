[package]
name = "specre"
version = "0.4.0"
edition = "2024"
description = "Atomic, living specification cards for AI-agent-friendly development"
license = "MIT"
repository = "https://github.com/yoshiakist/specre"

[dependencies]
clap = { version = "4", features = ["derive"] }
ulid = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }
rmcp = { version = "0.15", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_yml = "0.0.12"
globset = { version = "0.4", default-features = false }

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
libc = "0.2"
predicates = "3"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
all = { level = "deny", priority = -1 }
# allow specre::config::Config etc.
module_name_repetitions = "allow"
# percentage computation from file counts inherently requires usize/i64 → f64 casts
cast_precision_loss = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
